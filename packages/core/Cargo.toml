[package]
name = "chamberlain-core"
version = "0.2.0"
description = "Chamberlain framework core: heartbeat tick, trigger discovery, JS runtime host, state store, OS notification, tray"
authors = ["Mikoshiba-Kyu"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mikoshiba-Kyu/chamberlain-ai"
homepage = "https://github.com/Mikoshiba-Kyu/chamberlain-ai"
documentation = "https://docs.rs/chamberlain-core"
readme = "README.md"
keywords = ["chamberlain", "agent", "tauri", "assistant", "desktop"]
categories = ["gui", "development-tools"]
# NOTE: 明示 include。deno_core の `extension!` マクロが `src/bootstrap.js` を
# コンパイル時に取り込むため、デフォルトの Cargo publish include (src/**/*.rs) には
# 載らない .js を明示的に含める必要がある。LICENSE-* も同様。
include = [
    "src/**/*.rs",
    "src/**/*.js",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# NOTE: 意図的に `crate-type` を指定しない (デフォルト `rlib`)。`cdylib` は V8
# (rustyscript 経由) の TLS relocation (R_X86_64_TPOFF32 against
# v8::internal::g_current_isolate_) と衝突するため使えない。モバイル対応時は
# platform ごとの追加調整が必要。

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
# 実行時登録 (#58) のフォルダ選択。**Rust 側からしか呼ばない** ので、エージェント開発者の
# capability 宣言もフロントの npm 依存も増えない。
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1"
rustyscript = "0.12"
# OS credential manager 経由の secret store。Windows=Credential Manager,
# Linux=Secret Service (D-Bus / libsecret 経由)。Linux devcontainer には bus が
# 無いので実行時エラー、これは既知 (devcontainer 検証対象外)。
#
# v4 は apple-native-keyring-store が無条件 dep として付いてきて、その裏で
# security-framework 3.7 が bitflags ^2.11 を要求 → serde =1.0.219 pin と衝突する。
# v3 は feature フラグで切り離せるので、macOS を捨てる代わりに v3 を使う
# (macOS 対応は本 Issue のスコープ外)。
keyring = { version = "3", default-features = false, features = ["windows-native", "sync-secret-service"] }
# op_chamberlain_get_secret の実装で直接使う。rustyscript が再エクスポート
# している (rustyscript::deno_core) が、op2 マクロ経由の展開で `deno_core`
# クレートが top-level に見える必要があるので、こちらでも直接依存させる。
deno_core = "0.355"
# op が返す error 型として JsErrorBox が必要。deno_core が要求する JsErrorClass
# trait の実装が付いている。
deno_error = "0.7"
# Anthropic Messages API を叩くための HTTP client (Type II 秘書 AI + Type I トリガー
# 共通の chamberlain.ai.complete で使う)。async, rustls バックエンドで OpenSSL 非依存。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# builder() 起動時に .env を読み込むために使う。dev で `CHAMBERLAIN_SECRET_*` を
# 手軽に注入するためだけの用途 (詳細は README「env-var fallback」)。
dotenvy = "0.15"
# bitflags 2.13.0 は serde_core =1.0.228 を要求し、我々の serde =1.0.219 pin と
# 衝突する。ここでは deno_core → v8 → bitflags の連鎖で入ってくるので、Cargo が
# 上位バージョンに寄せないよう 2.9.x に固定する。serde ピン解除時に外せる。
bitflags = "=2.9.4"
# #18 (Phase 2): wall-clock schedule DSL と TZ セマンティクスの実装で使う。
# chrono は wall-clock 時刻計算、chrono-tz は IANA name → TZ 解決、iana-time-zone は
# OS TZ の検出 (user local)。default-features を落として serde 依存を避ける
# (chrono の serde feature は serde 1.x と互換だが、我々の =1.0.219 pin と衝突する
# 可能性を最小化するためオフのままにする)。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = { version = "0.10", default-features = false }
iana-time-zone = "0.1"
# #42: 実行履歴レイヤ。追記専用 + 時系列クエリ + retention という形なので、
# tauri-plugin-store の JSON (save() でファイル全体を書き直す) では苦しい。
#
# `bundled` で SQLite 本体を同梱する。システムの libsqlite3 に依存すると
# 「配布先の環境次第で動かない」が発生し、デスクトップアプリとして成立しない。
# 代償としてビルドに C コンパイラが要る (3 プラットフォームビルドは #37 / #38)。
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
