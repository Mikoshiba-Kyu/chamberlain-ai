name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチに新しい push が来たら古い実行を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tauri の Linux ネイティブ依存。bundle は作らないが、chamberlain-core が
      # tauri に依存しているのでコンパイル時の pkg-config 解決に必要。
      # .devcontainer/Dockerfile と同じ組み合わせ。
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # clippy は cargo check と同じコンパイルを行うので、check は別途走らせない
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 純粋ロジック (schedule / tasks) と配線層 (worker) のテスト。webview も
      # OS 通知も起動しないので Linux runner で完結する (#46)
      - name: cargo test
        run: cargo test --workspace

      # crates.io に上げる成果物そのものを検証する。src/bootstrap.js のように
      # Cargo のデフォルト include (src/**/*.rs) から漏れるファイルは workspace の
      # cargo check では検出できず、publish 後の成果物だけが壊れる
      # (packages/core/Cargo.toml の include 参照)。
      #
      # publish 済みの version に対しては "already exists on crates.io index" が
      # warning として出るが、検証自体は通る。
      - name: cargo publish --dry-run
        run: cargo publish -p chamberlain-core --dry-run

  frontend:
    name: Frontend / scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # examples/react は templates/react の共有部分のコピー。真実は templates 側
      # (#39)。片方だけ直したまま merge されると、publish された scaffold の出力だけが
      # 古いという最悪の壊れ方をするので、ここで必ず落とす
      - name: Template / example が同期しているか
        run: pnpm sync:template:check

      # tsc + vite build。examples/react が唯一の TS ビルド対象
      - name: Build example frontend
        run: pnpm --filter chamberlain-example-react build

      # 表示用純関数の vitest。テストの真実は templates/react 側にあり、上の
      # sync:template:check を通ったコピーをここで実行している (#46)
      - name: Test example frontend
        run: pnpm --filter chamberlain-example-react test

      # npm に上げる tarball の中身を検証する。templates/ の同梱漏れや
      # _gitignore の扱いはここでしか見えない
      - name: npm pack --dry-run
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          # トリガー仕様書の skill (#60)。`files` を絞ったときにここで落ちる —
          # 下の smoke test は working tree の bin/create.js を叩くので、tarball に
          # 入っているかは**この step でしか見えない**
          grep -q "templates/react/_claude/skills/chamberlain-triggers/SKILL.md" /tmp/pack.txt
        working-directory: packages/create-chamberlain

      # scaffold CLI の smoke test。生成物の cargo check はしない — テンプレは
      # crates.io の chamberlain-core を version 依存で引くので、PR の変更内容とは
      # 無関係な検証になってしまう
      - name: Scaffold smoke test
        run: |
          node packages/create-chamberlain/bin/create.js "${RUNNER_TEMP}/scaffold-check"
          test -f "${RUNNER_TEMP}/scaffold-check/package.json"
          test -f "${RUNNER_TEMP}/scaffold-check/src-tauri/Cargo.toml"
          test -f "${RUNNER_TEMP}/scaffold-check/src-tauri/tauri.conf.json"
          test -f "${RUNNER_TEMP}/scaffold-check/.gitignore"
          test -d "${RUNNER_TEMP}/scaffold-check/triggers"
          # トリガー仕様書の skill (#60)。core から template へ配られたものが scaffold
          # 出力まで届き、_claude → .claude に戻っていること (tarball 同梱は上の step)
          test -f "${RUNNER_TEMP}/scaffold-check/.claude/skills/chamberlain-triggers/SKILL.md"
          test ! -e "${RUNNER_TEMP}/scaffold-check/_claude"
          # 3 プラットフォームビルドのワークフロー (#37)。テンプレへの同梱漏れと
          # _github → .github のリネーム漏れをここで止める
          test -f "${RUNNER_TEMP}/scaffold-check/.github/workflows/build.yml"
          test ! -e "${RUNNER_TEMP}/scaffold-check/_github"
